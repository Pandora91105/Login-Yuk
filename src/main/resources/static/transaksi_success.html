<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Success - Login Yuk</title>

    <link rel="stylesheet" th:href="@{/css/transaksi_success.css}">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">

    <div class="logo">
        LOGIN YUK
    </div>

    <div class="nav-icons">
        <a href="#">💬</a>
        <a href="#">📋</a>
        <a href="#">👤</a>
    </div>

</nav>

<div class="container">

    <div class="success-card">

        <div class="success-icon">
            ✓
        </div>

        <h1>Payment Successful!</h1>

        <p class="success-text">
            Terima kasih atas pembelian Anda.
            Pembayaran telah berhasil diproses.
        </p>

        <!-- INVOICE -->

        <div class="invoice-box">

            <h2>
                Invoice #
                <span th:text="${invoice.invoiceNumber}">
                    INV-0001
                </span>
            </h2>

            <div class="invoice-row">
                <span>Transaction ID</span>

                <strong th:text="${transaksi.transaksiId}">
                    TRX-0001
                </strong>
            </div>

            <div class="invoice-row">
                <span>Game</span>

                <strong th:text="${game.namaGame}">
                    Mobile Legends
                </strong>
            </div>

            <div class="invoice-row">
                <span>Payment Method</span>

                <strong>QRIS</strong>
            </div>

            <div class="invoice-row">
                <span>Date</span>

                <strong th:text="${tanggal}">
                    16 Juni 2026
                </strong>
            </div>

            <div class="invoice-row total">
                <span>Amount</span>

                <strong
                th:text="'Rp ' + ${#numbers.formatInteger(transaksi.harga,0,'POINT')}">
                    Rp 250.000
                </strong>
            </div>

        </div>

        <!-- BUTTON -->

        <div class="button-group">

            <a href="#"
               class="download-btn">

                Download Receipt

            </a>

            <a th:href="@{/dashboard}"
               class="store-btn">

                Return to Store

            </a>

        </div>

    </div>

</div>

</body>
</html>
