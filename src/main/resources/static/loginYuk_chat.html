<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoginYuk_chat</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/loginyuk_chat.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Krona+One&family=League+Spartan:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <!-- ======= NAVBAR ======= -->
    <header class="navbar">
        <a class="brand" href="dashboard.html">LOGINYUK</a>
        
        <div class="search-wrap">
            <input type="text" placeholder="Cari akun game favoritmu..." />
            <span class="search-icon">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/>
            </svg>
            </span>
        </div>
        
        <nav class="nav-actions">
            <!-- Chat -->
            <a class="nav-btn" title="Pesan" href="loginYuk_chat.html">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 2H4C2.9 2 2 2.9 2 4v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 12H6l-2 2V4h16v10z"/>
            </svg>
            </a>
            <!-- Orders -->
            <!-- Orders -->
            <a class="nav-btn" title="Wishlist" href="wishlist.html">
            <img src="assets/wishlist.png">
            </a>

            <button class="nav-btn" title="Transaction">
            <img src="assets/basket3.png">
            </button>

            <!-- Profile -->
            <button class="nav-btn" title="Profil">
            <img id="profilePhoto" src="assets/default-avatar.jpg"
            style="width:32px;height:32px;border-radius:50%;object-fit:cover;">
            </button>
        </nav>
        </header>
    <!-- ======= END NAVBAR ======= -->


    <!-- ======= MAIN CONTENT ======= -->
    <div class="chat-container">

        <!-- === SIDEBAR (list room) === -->
        <aside class="chat-sidebar">

            <!-- Room item — di-generate dari JS nanti -->
            <div class="room-item active">
                <img src="/assets/image_14.png" alt="avatar" class="room-avatar">
                <div class="room-info">
                    <span class="room-name">Store Name</span>
                    <span class="room-preview">pesan terakhir...</span>
                </div>
            </div>
            <!-- /room-item -->

        </aside>
        <!-- === END SIDEBAR === -->


        <!-- === CHAT AREA === -->
        <section class="chat-area">

            <!-- Header chat -->
            <div class="chat-header">
                <img src="assets/image_14.png" alt="avatar" class="chat-avatar">
                <div class="chat-header-info">
                    <span class="chat-store-name">Store Name</span>
                    <span class="chat-status">Active 4H ago</span>
                </div>
            </div>
            <!-- /chat-header -->


            <!-- Area pesan -->
            <div class="chat-messages" id="chatMessages">

            </div>
            <!-- /chat-messages -->


            <!-- Input kirim pesan -->
            <div class="chat-input-area">
                <input
                    type="text"
                    id="messageInput"
                    class="chat-input"
                    placeholder="Ketik pesan...">
                <button id="sendBtn" class="send-btn">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </div>
            <!-- /chat-input-area -->

        </section>
        <!-- === END CHAT AREA === -->

    </div>
    <!-- ======= END MAIN CONTENT ======= -->


    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="js/loginYuk_chat.js"></script>
</body>
</html>
