<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#1f1f1f;
    color:white;
    height:100vh;
    overflow:hidden;
}

/* HEADER */

.header{
    height:80px;
    background:#242424;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 30px;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:white;
}

/* TITLE */

.title-section{
    background:#050511;
    padding:30px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.title-section h1{
    color:#63d4bd;
    font-size:40px;
}

.search{
    width:500px;
    padding:15px 20px;
    border:none;
    border-radius:30px;
    outline:none;
}

/* CONTENT */

.content{
    height:calc(100vh - 170px);
    display:flex;
    flex-direction:column;
    padding:20px;
}

/* HEADER TABLE */

.table-header{
    display:grid;
    grid-template-columns:3fr 1fr 1fr 1fr 1fr 1fr;
    background:#111;
    padding:15px;
    text-align:center;
    font-weight:bold;
}

/* PRODUCT LIST */

.product-list{
    flex:1;
    overflow-y:auto;
    margin-top:10px;
}

.product-list::-webkit-scrollbar{
    width:8px;
}

.product-list::-webkit-scrollbar-thumb{
    background:#63d4bd;
    border-radius:20px;
}

.store-box{
    background:#2a2a2a;
    margin-bottom:15px;
}

.store-name{
    padding:15px;
    border-bottom:1px solid #444;
    font-weight:bold;
}

.product-row{
    display:grid;
    grid-template-columns:3fr 1fr 1fr 1fr 1fr 1fr;
    align-items:center;
    padding:20px;
}

.product-info{
    display:flex;
    align-items:center;
    gap:20px;
}

.product-info img{
    width:120px;
    height:120px;
    object-fit:cover;
}

.status{
    background:#77e06c;
    text-align:center;
    padding:8px;
    border-radius:20px;
    width:120px;
    margin:auto;
}

.price,
.qty,
.total{
    text-align:center;
    font-weight:bold;
}

.delete-btn{
    border:none;
    background:#5a4848;
    color:#ff7d7d;
    padding:10px 20px;
    border-radius:20px;
    cursor:pointer;
}

/* FOOTER */

.footer-checkout{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:90px;
    background:#262626;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 30px;
}

.checkout-btn{
    border:none;
    background:#84d9c4;
    color:white;
    padding:15px 40px;
    font-size:18px;
    border-radius:8px;
    cursor:pointer;
}

</style>

</head>
<body>

<header class="header">
    <div class="logo">
        LOGIN YUK
    </div>
</header>

<section class="title-section">

    <h1>My Wishlist</h1>

    <input
        type="text"
        class="search"
        placeholder="Cari Produk..."
    >

</section>

<div class="content">

    <div class="table-header">
        <div>Product</div>
        <div>Status</div>
        <div>Price</div>
        <div>Qty</div>
        <div>Total</div>
        <div>Action</div>
    </div>

    <div class="product-list">

        <% for(int i=1; i<=20; i++){ %>

        <div class="store-box">

            <div class="store-name">
                Store <%=i%>
            </div>

            <div class="product-row">

                <div class="product-info">

                    <img src="https://picsum.photos/200?random=<%=i%>">

                    <div>
                        <h3>Product <%=i%></h3>
                    </div>

                </div>

                <div>
                    <div class="status">
                        Available
                    </div>
                </div>

                <div class="price">
                    Rp 100.000
                </div>

                <div class="qty">
                    1
                </div>

                <div class="total">
                    Rp 100.000
                </div>

                <div>
                    <button class="delete-btn">
                        Hapus
                    </button>
                </div>

            </div>

        </div>

        <% } %>

    </div>

</div>

<footer class="footer-checkout">

    <h3>
        Total (20 Product)
    </h3>

    <button class="checkout-btn">
        Check Out
    </button>

</footer>

</body>
</html>
