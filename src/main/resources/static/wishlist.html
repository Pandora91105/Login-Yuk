<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Wishlist</title>

<link href="https://fonts.googleapis.com/css2?family=Krona+One&family=League+Spartan:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050512;
    color:white;
    font-family:'League Spartan',sans-serif;
    overflow-x:hidden;
}

/* ================= NAVBAR ================= */

.navbar{
    height:90px;
    background:#222226;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 25px;
}

.logo{
    font-family:'Krona One',sans-serif;
    font-size:18px;
    color:white;
}

.nav-right{
    display:flex;
    gap:25px;
    align-items:center;
}

.nav-icon{
    font-size:28px;
    color:#63d8c2;
    cursor:pointer;
}

/* ================= HEADER ================= */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:40px 55px;
}

.header h1{
    font-family:'Krona One',sans-serif;
    color:#1ED5B3;
    font-size:48px;
}

.search-box{
    width:650px;
    position:relative;
}

.search-box input{
    width:100%;
    height:50px;
    border:none;
    outline:none;
    border-radius:30px;
    background:#4a4a4f;
    padding:0 55px 0 20px;
    color:white;
    font-size:18px;
}

.search-icon{
    position:absolute;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    color:#63d8c2;
    font-size:22px;
}

/* ================= DIVIDER ================= */

.divider{
    height:70px;
    background:#222226;
}

/* ================= TABLE HEADER ================= */

.table-header{
    display:grid;
    grid-template-columns:
    4fr
    1.3fr
    1.3fr
    0.8fr
    1.3fr
    1fr;

    padding:40px 60px 20px;
}

.table-header div{
    font-family:'Krona One',sans-serif;
    font-size:18px;
}

/* ================= ITEM ================= */

.item{
    background:#242529;
    margin:0 24px 20px;
    padding:15px;
}

.store-name{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:15px;

    font-family:'Krona One',sans-serif;
    font-size:16px;
}

.checkbox{
    width:25px;
    height:25px;
    border:3px solid #666;
    cursor:pointer;
}

.product-row{
    display:grid;
    grid-template-columns:
    4fr
    1.3fr
    1.3fr
    0.8fr
    1.3fr
    1fr;

    align-items:center;
}

.product-info{
    display:flex;
    align-items:center;
    gap:15px;
}

.product-info img{
    width:130px;
    height:130px;
    object-fit:cover;
}

.product-title{
    font-size:24px;
    font-weight:500;
}

.status{
    background:#5CE176;
    color:white;
    padding:10px 20px;
    border-radius:25px;
    display:inline-block;

    font-size:18px;
    font-weight:700;
}

.price,
.qty,
.total{
    font-family:'Krona One',sans-serif;
    font-size:16px;
}

.delete-btn{
    border:none;
    background:#5A4649;
    color:#FF6D6D;
    padding:12px 30px;
    border-radius:25px;

    font-family:'Krona One',sans-serif;
    font-size:15px;

    cursor:pointer;
}

/* ================= FOOTER ================= */

.footer-bar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;

    height:95px;

    background:#242529;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 35px;

    box-shadow:
    0 -5px 20px rgba(255,255,255,0.15);
}

.select-all{
    display:flex;
    align-items:center;
    gap:15px;

    font-family:'Krona One',sans-serif;
    font-size:16px;
}

.total-price{
    font-family:'Krona One',sans-serif;
    font-size:18px;
}

.checkout-btn{
    border:none;
    background:#63D8C2;
    color:white;

    padding:18px 40px;

    border-radius:8px;

    font-family:'Krona One',sans-serif;
    font-size:18px;

    cursor:pointer;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1000px){

.header{
    flex-direction:column;
    gap:20px;
}

.search-box{
    width:100%;
}

.table-header{
    display:none;
}

.product-row{
    grid-template-columns:1fr;
    gap:15px;
}

.footer-bar{
    flex-direction:column;
    height:auto;
    padding:20px;
    gap:15px;
}
}

</style>
</head>
<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="logo">
        LOGIN YUK
    </div>

    <div class="nav-right">
        <span class="nav-icon">💬</span>
        <span class="nav-icon">📋</span>
        <span class="nav-icon">👤</span>
    </div>

</nav>

<!-- ================= HEADER ================= -->

<section class="header">

    <h1>My Wishlist</h1>

    <div class="search-box">
        <input type="text">
        <span class="search-icon">🔍</span>
    </div>

</section>

<div class="divider"></div>

<!-- ================= TABLE HEADER ================= -->

<div class="table-header">

    <div>Product</div>
    <div>Status</div>
    <div>Price</div>
    <div>Qty</div>
    <div>Total</div>
    <div>Action</div>

</div>

<!-- ================= ITEM 1 ================= -->

<div class="item">

    <div class="store-name">
        <div class="checkbox"></div>
        Store name
    </div>

    <div class="product-row">

        <div class="product-info">

            <div class="checkbox"></div>

            <img src="assets/image_coc2.png" alt="CoC lvl 50">

            <div class="product-title">
                CoC lvl 50
            </div>

        </div>

        <div>
            <span class="status">Available</span>
        </div>

        <div class="price">
            Rp 65.000
        </div>

        <div class="qty">
            1
        </div>

        <div class="total">
            Rp 65.000
        </div>

        <div>
            <button class="delete-btn">
                Hapus
            </button>
        </div>

    </div>

</div>

<!-- ================= ITEM 2 ================= -->

<div class="item">

    <div class="store-name">
        <div class="checkbox"></div>
        Store name
    </div>

    <div class="product-row">

        <div class="product-info">

            <div class="checkbox"></div>

            <img src="assets/image_ml3.png" alt="ML Rank Mythic">

            <div class="product-title">
                ML RANK MYTHIC
            </div>

        </div>

        <div>
            <span class="status">Available</span>
        </div>

        <div class="price">
            Rp 2.745.000
        </div>

        <div class="qty">
            1
        </div>

        <div class="total">
            Rp 2.745.000
        </div>

        <div>
            <button class="delete-btn">
                Hapus
            </button>
        </div>

    </div>

</div>

<!-- ================= ITEM 3 ================= -->

<div class="item">

    <div class="store-name">
        <div class="checkbox"></div>
        Store name
    </div>

    <div class="product-row">

        <div class="product-info">

            <div class="checkbox"></div>

            <img src="assets/image_ml4.png" alt="ML Lapu-Lapu">

            <div class="product-title">
                ML Lapu-Lapu
            </div>

        </div>

        <div>
            <span class="status">Available</span>
        </div>

        <div class="price">
            Rp 750.000
        </div>

        <div class="qty">
            1
        </div>

        <div class="total">
            Rp 750.000
        </div>

        <div>
            <button class="delete-btn">
                Hapus
            </button>
        </div>

    </div>

</div>

<!-- ================= FOOTER ================= -->

<div class="footer-bar">

    <div class="select-all">
        <div class="checkbox"></div>
        Select All
    </div>

    <div class="total-price">
        Total (0 Product) : Rp 0
    </div>

    <button class="checkout-btn">
        Check Out
    </button>

</div>

</body>
</html>
