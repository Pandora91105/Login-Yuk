<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wishlist</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#060611;
    color:#fff;
}

/* ================= NAVBAR ================= */

.navbar{
    height:90px;
    background:#202126;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 25px;
}

.logo{
    font-size:22px;
    font-weight:600;
    letter-spacing:2px;
}

.nav-icons{
    display:flex;
    gap:25px;
    font-size:28px;
    color:#62e3cc;
}

/* ================= HEADER ================= */

.header{
    background:#050512;
    padding:40px 55px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h1{
    color:#18d4b3;
    font-size:54px;
    font-weight:700;
}

.search-box{
    position:relative;
    width:650px;
}

.search-box input{
    width:100%;
    height:50px;
    border:none;
    outline:none;
    border-radius:30px;
    background:#44444d;
    color:white;
    padding:0 20px;
}

.search-box span{
    position:absolute;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    color:#62e3cc;
}

/* ================= TABLE HEADER ================= */

.table-header{
    display:grid;
    grid-template-columns:4fr 1.3fr 1.3fr 1fr 1.3fr 1.3fr;
    padding:40px 60px 20px;
    font-size:20px;
    font-weight:600;
}

/* ================= ITEM ================= */

.item{
    background:#242529;
    margin:0 25px 20px;
    padding:15px;
}

.store{
    font-size:18px;
    font-weight:600;
    margin-bottom:15px;
}

.product-row{
    display:grid;
    grid-template-columns:4fr 1.3fr 1.3fr 1fr 1.3fr 1.3fr;
    align-items:center;
}

.product-info{
    display:flex;
    align-items:center;
    gap:15px;
}

.checkbox{
    width:26px;
    height:26px;
    border:3px solid #666;
    cursor:pointer;
}

.product-info img{
    width:130px;
    height:130px;
    object-fit:cover;
}

.product-title{
    font-size:20px;
}

.status{
    display:inline-block;
    background:#59df77;
    padding:8px 18px;
    border-radius:30px;
    font-weight:600;
}

.price,
.qty,
.total{
    font-size:18px;
    font-weight:600;
}

.delete-btn{
    border:none;
    background:#544245;
    color:#ff6c6c;
    padding:10px 25px;
    border-radius:25px;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
}

/* ================= FOOTER ================= */

.footer-bar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#242529;
    height:95px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 35px;
    box-shadow:0 -4px 15px rgba(255,255,255,0.15);
}

.select-all{
    display:flex;
    align-items:center;
    gap:15px;
    font-size:20px;
    font-weight:600;
}

.total-text{
    font-size:22px;
    font-weight:700;
}

.checkout-btn{
    border:none;
    background:#61d4bf;
    color:white;
    font-size:20px;
    font-weight:700;
    padding:15px 45px;
    border-radius:8px;
    cursor:pointer;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">LOGIN YUK</div>

    <div class="nav-icons">
        💬 📋 👤
    </div>
</div>

<!-- HEADER -->
<div class="header">
    <h1>My Wishlist</h1>

    <div class="search-box">
        <input type="text">
        <span>🔍</span>
    </div>
</div>

<!-- TABLE HEADER -->
<div class="table-header">
    <div>Product</div>
    <div>Status</div>
    <div>Price</div>
    <div>Qty</div>
    <div>Total</div>
    <div>Action</div>
</div>

<!-- ITEM 1 -->
<div class="item">

    <div class="store">
        ☐ Store name
    </div>

    <div class="product-row">

        <div class="product-info">
            <div class="checkbox"></div>

            <img src="assets/image_coc2.png" alt="CoC lvl 50">

            <div class="product-title">
                CoC lvl 50
            </div>
        </div>

        <div>
            <span class="status">Available</span>
        </div>

        <div class="price">
            Rp 65.000
        </div>

        <div class="qty">
            1
        </div>

        <div class="total">
            Rp 65.000
        </div>

        <div>
            <button class="delete-btn">Hapus</button>
        </div>

    </div>

</div>

<!-- ITEM 2 -->
<div class="item">

    <div class="store">
        ☐ Store name
    </div>

    <div class="product-row">

        <div class="product-info">
            <div class="checkbox"></div>

            <img src="assets/image_ml3.png" alt="ML Rank Mythic">

            <div class="product-title">
                ML RANK MYTHIC
            </div>
        </div>

        <div>
            <span class="status">Available</span>
        </div>

        <div class="price">
            Rp 2.745.000
        </div>

        <div class="qty">
            1
        </div>

        <div class="total">
            Rp 2.745.000
        </div>

        <div>
            <button class="delete-btn">Hapus</button>
        </div>

    </div>

</div>

<!-- ITEM 3 -->
<div class="item">

    <div class="store">
        ☐ Store name
    </div>

    <div class="product-row">

        <div class="product-info">
            <div class="checkbox"></div>

            <img src="assets/image_ml4.png" alt="ML Lapu-Lapu">

            <div class="product-title">
                ML Lapu-Lapu
            </div>
        </div>

        <div>
            <span class="status">Available</span>
        </div>

        <div class="price">
            Rp 750.000
        </div>

        <div class="qty">
            1
        </div>

        <div class="total">
            Rp 750.000
        </div>

        <div>
            <button class="delete-btn">Hapus</button>
        </div>

    </div>

</div>

<!-- FOOTER -->
<div class="footer-bar">

    <div class="select-all">
        <div class="checkbox"></div>
        Select All
    </div>

    <div class="total-text">
        Total (0 Product) : Rp 0
    </div>

    <button class="checkout-btn">
        Check Out
    </button>

</div>

</body>
</html>
