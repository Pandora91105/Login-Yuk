<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wishlist</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#1f1f1f;
    color:white;
    height:100vh;
    overflow:hidden;
}

/* HEADER */

.header{
    height:90px;
    background:#242424;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 30px;
}

.logo{
    font-size:24px;
    font-weight:600;
    letter-spacing:2px;
}

.header-icons{
    display:flex;
    gap:25px;
    font-size:32px;
    color:#84d9c4;
}

/* TITLE */

.title-section{
    background:#04040f;
    padding:40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.title-section h1{
    font-size:55px;
    color:#63d4bd;
}

.search-box{
    position:relative;
}

.search{
    width:650px;
    padding:18px 60px 18px 25px;
    border:none;
    outline:none;
    border-radius:40px;
    background:#3b3b43;
    color:white;
    font-size:18px;
}

.search-icon{
    position:absolute;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    font-size:28px;
    color:#84d9c4;
}

/* CONTENT */

.content{
    height:calc(100vh - 250px);
    padding:20px;
    overflow:hidden;
}

/* TABLE HEADER */

.table-header{
    display:grid;
    grid-template-columns:4fr 1.5fr 1.5fr 1fr 1.5fr 1.5fr;
    padding:20px;
    font-size:20px;
    font-weight:600;
    text-align:center;
    background:#050510;
}

/* PRODUCT LIST */

.product-list{
    height:100%;
    overflow-y:auto;
    padding-bottom:120px;
}

.product-list::-webkit-scrollbar{
    width:8px;
}

.product-list::-webkit-scrollbar-thumb{
    background:#63d4bd;
    border-radius:20px;
}

.store-box{
    background:#2a2a2a;
    margin-bottom:20px;
}

.store-name{
    padding:15px;
    border-bottom:2px solid #151515;
    display:flex;
    align-items:center;
    gap:15px;
    font-size:20px;
    font-weight:600;
}

.checkbox{
    width:28px;
    height:28px;
}

/* PRODUCT ROW */

.product-row{
    display:grid;
    grid-template-columns:4fr 1.5fr 1.5fr 1fr 1.5fr 1.5fr;
    align-items:center;
    padding:25px;
}

.product-info{
    display:flex;
    align-items:center;
    gap:20px;
}

.product-info img{
    width:130px;
    height:130px;
    object-fit:cover;
}

.product-title{
    font-size:20px;
}

.status{
    background:#78e36e;
    width:150px;
    text-align:center;
    padding:10px;
    border-radius:30px;
    margin:auto;
    font-size:18px;
    font-weight:600;
}

.price,
.qty,
.total{
    text-align:center;
    font-size:18px;
    font-weight:600;
}

.delete-btn{
    background:#5b4949;
    color:#ff7c7c;
    border:none;
    padding:12px 28px;
    border-radius:25px;
    font-size:18px;
    cursor:pointer;
}

/* FOOTER */

.footer-checkout{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:100px;
    background:rgba(38,38,38,.95);
    backdrop-filter:blur(10px);
    border-top:1px solid rgba(255,255,255,.1);

    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 35px;
}

.footer-left{
    display:flex;
    align-items:center;
    gap:15px;
    font-size:18px;
    font-weight:600;
}

.footer-center{
    font-size:18px;
    font-weight:600;
}

.checkout-btn{
    border:none;
    background:#84d9c4;
    color:white;
    padding:15px 45px;
    font-size:18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

</style>
</head>
<body>

<header class="header">

    <div class="logo">
        LOGIN YUK
    </div>

    <div class="header-icons">
        💬 📑 👤
    </div>

</header>

<section class="title-section">

    <h1>My Wishlist</h1>

    <div class="search-box">
        <input type="text" class="search">
        <span class="search-icon">🔍</span>
    </div>

</section>

<div class="content">

    <div class="table-header">
        <div>Product</div>
        <div>Status</div>
        <div>Price</div>
        <div>Qty</div>
        <div>Total</div>
        <div>Action</div>
    </div>

    <div class="product-list">

        <!-- PRODUCT 1 -->

        <div class="store-box">

            <div class="store-name">
                <input type="checkbox" class="checkbox">
                Store name
            </div>

            <div class="product-row">

                <div class="product-info">
                    <input type="checkbox" class="checkbox">

                    <img src="https://picsum.photos/200?random=1">

                    <div class="product-title">
                        CoC Lvl 50
                    </div>
                </div>

                <div>
                    <div class="status">
                        Available
                    </div>
                </div>

                <div class="price">
                    Rp 65.000
                </div>

                <div class="qty">
                    1
                </div>

                <div class="total">
                    Rp 65.000
                </div>

                <div style="text-align:center;">
                    <button class="delete-btn">
                        Hapus
                    </button>
                </div>

            </div>

        </div>

        <!-- LOOP DEMO -->

        <script>

            for(let i=2;i<=20;i++){

                document.write(`
                    <div class="store-box">

                        <div class="store-name">
                            <input type="checkbox" class="checkbox">
                            Store ${i}
                        </div>

                        <div class="product-row">

                            <div class="product-info">

                                <input type="checkbox" class="checkbox">

                                <img src="https://picsum.photos/200?random=${i}">

                                <div class="product-title">
                                    Product ${i}
                                </div>

                            </div>

                            <div>
                                <div class="status">
                                    Available
                                </div>
                            </div>

                            <div class="price">
                                Rp 100.000
                            </div>

                            <div class="qty">
                                1
                            </div>

                            <div class="total">
                                Rp 100.000
                            </div>

                            <div style="text-align:center;">
                                <button class="delete-btn">
                                    Hapus
                                </button>
                            </div>

                        </div>

                    </div>
                `);

            }

        </script>

    </div>

</div>

<footer class="footer-checkout">

    <div class="footer-left">
        <input type="checkbox" class="checkbox">
        Select All
    </div>

    <div class="footer-center">
        Total (20 Product) : Rp 0
    </div>

    <button class="checkout-btn">
        Check Out
    </button>

</footer>

</body>
</html>
