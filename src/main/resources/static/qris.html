<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pembayaran QRIS - Login Yuk</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: white; font-family: Arial, sans-serif; }
    header { background: #0f0f1a; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { color: white; font-size: 20px; letter-spacing: 2px; }
    .nav-icons { display: flex; gap: 20px; font-size: 24px; cursor: pointer; color: #00e5a0; }
    .container { padding: 40px 30px; text-align: center; }
    .note { font-size: 18px; font-weight: bold; color: white; margin-bottom: 30px; line-height: 1.6; }
    .qr-wrapper { background: #ccc; width: 400px; height: 400px; margin: 0 auto 30px; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
    .qr-wrapper img { width: 320px; height: 320px; background: white; padding: 10px; }
    .qr-placeholder { width: 320px; height: 320px; background: white; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #333; border: 2px solid #aaa; }
    .timer-label { font-size: 18px; font-weight: bold; color: white; }
    .timer { font-size: 24px; font-weight: bold; color: #ff4444; display: inline; }
    .btn-bayar { margin-top: 40px; background: #00e5a0; color: #0f0f1a; border: none; padding: 16px 50px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
    .btn-bayar:hover { opacity: 0.85; }
    .expired { color: #ff4444; font-size: 18px; margin-top: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>LOGIN YUK</h1>
    <div class="nav-icons">
      <span>💬</span>
      <span>📋</span>
      <span>👤</span>
    </div>
  </header>

  <div class="container">
    <p class="note">
      Note : Pesanan akan otomatis dibatalkan jika pembayaran tidak dilakukan<br>
      dalam batas waktu yang diberikan.
    </p>

    <div class="qr-wrapper">
      <div class="qr-placeholder">
        <!-- QR Code placeholder --><br>
        <svg width="280" height="280" viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
          <rect width="280" height="280" fill="white"/>
          <rect x="10" y="10" width="80" height="80" fill="none" stroke="black" stroke-width="8"/>
          <rect x="25" y="25" width="50" height="50" fill="black"/>
          <rect x="190" y="10" width="80" height="80" fill="none" stroke="black" stroke-width="8"/>
          <rect x="205" y="25" width="50" height="50" fill="black"/>
          <rect x="10" y="190" width="80" height="80" fill="none" stroke="black" stroke-width="8"/>
          <rect x="25" y="205" width="50" height="50" fill="black"/>
          <rect x="110" y="10" width="10" height="10" fill="black"/>
          <rect x="130" y="10" width="10" height="10" fill="black"/>
          <rect x="150" y="20" width="10" height="10" fill="black"/>
          <rect x="110" y="30" width="20" height="10" fill="black"/>
          <rect x="160" y="30" width="10" height="10" fill="black"/>
          <rect x="110" y="110" width="10" height="10" fill="black"/>
          <rect x="130" y="110" width="20" height="10" fill="black"/>
          <rect x="160" y="120" width="10" height="10" fill="black"/>
          <rect x="110" y="130" width="10" height="20" fill="black"/>
          <rect x="140" y="140" width="20" height="10" fill="black"/>
          <rect x="190" y="110" width="30" height="10" fill="black"/>
          <rect x="230" y="110" width="20" height="10" fill="black"/>
          <rect x="200" y="130" width="10" height="20" fill="black"/>
          <rect x="230" y="140" width="20" height="10" fill="black"/>
          <rect x="190" y="160" width="20" height="10" fill="black"/>
          <rect x="220" y="150" width="10" height="20" fill="black"/>
          <rect x="110" y="190" width="20" height="10" fill="black"/>
          <rect x="140" y="200" width="10" height="10" fill="black"/>
          <rect x="160" y="190" width="10" height="20" fill="black"/>
          <rect x="110" y="220" width="10" height="30" fill="black"/>
          <rect x="130" y="230" width="20" height="10" fill="black"/>
          <rect x="160" y="220" width="20" height="10" fill="black"/>
        </svg>
      </div>
    </div>

    <p class="timer-label">Bayar dalam waktu : <span class="timer" id="timer">2 : 59 : 59</span></p>
    <div id="expiredMsg"></div>

    <br>
    <button class="btn-bayar" id="btnBayar" onclick="konfirmasiBayar()">Saya Sudah Bayar</button>
  </div>

  <script>
    // Countdown timer 3 menit
    let totalDetik = 3 * 60 * 60; // 3 jam sesuai mockup

    const timerEl = document.getElementById('timer');
    const expiredEl = document.getElementById('expiredMsg');
    const btnBayar = document.getElementById('btnBayar');

    const interval = setInterval(() => {
      if (totalDetik <= 0) {
        clearInterval(interval);
        timerEl.textContent = '0 : 00 : 00';
        expiredEl.innerHTML = '<p class="expired">Waktu pembayaran habis. Transaksi dibatalkan.</p>';
        btnBayar.disabled = true;
        btnBayar.style.opacity = '0.4';
        return;
      }
      totalDetik--;
      const jam = Math.floor(totalDetik / 3600);
      const menit = Math.floor((totalDetik % 3600) / 60);
      const detik = totalDetik % 60;
      timerEl.textContent = `${jam} : ${String(menit).padStart(2,'0')} : ${String(detik).padStart(2,'0')}`;
    }, 1000);

    async function konfirmasiBayar() {
      const transaksiId = localStorage.getItem('transaksiId');
      if (!transaksiId) {
        alert('Data transaksi tidak ditemukan.');
        return;
      }
      try {
        const res = await fetch(`http://localhost:8080/api/transaksi/konfirmasi/${transaksiId}`, {
          method: 'PUT'
        });
        if (!res.ok) throw new Error('Gagal');
        const data = await res.json();
        localStorage.setItem('transaksiData', JSON.stringify(data));
        window.location.href = 'payment-success.html';
      } catch (e) {
        alert('Gagal konfirmasi pembayaran. Coba lagi.');
      }
    }
  </script>
</body>
</html>
